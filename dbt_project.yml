name: "jgrants"
version: "1.0.0"

profile: "jgrants"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  jgrants:
    +database: jgrants
    subsidy:
      +materialized: table
      # raw は取得したまま、stg は JSON の項目の取り出しと型付け。どちらも mart の SQL に展開し、テーブルは作らない
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
