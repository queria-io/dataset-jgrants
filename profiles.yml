jgrants:
  target: default
  outputs:
    default:
      type: duckdb
      path: ":memory:"
      database: jgrants
      schema: main
      threads: 1
      extensions:
        - httpfs
        - ducklake
        - sqlite
      # fdl checkout が作った作業場のカタログ (SQLite) に書く。データファイルの置き場は
      # checkout がカタログに記録している。上げるのは fdl commit (shared/scripts/build-fdl.sh)
      attach:
        - path: "ducklake:{{ env_var('FDL_WORKING') }}"
          alias: jgrants
          is_ducklake: true
          options:
            META_TYPE: "'sqlite'"
            # 既定のままだと小さいテーブルがカタログの中に収まり parquet が
            # 1 つも生成されない。fdl commit はインライン化された行を断るので、常に切る
            DATA_INLINING_ROW_LIMIT: 0
