schema: subsidy
name: details
title: Jグランツの補助金詳細（原典 JSON）
description: |-
  Jグランツの公開 API が返す補助金詳細（V2）の JSON を、1 補助金 1 行で持ちます。subsidies・rounds にない項目を見るときに使います。

  - 添付は base64 の本体を除き、ファイル名だけを持ちます
primary_key: [id]
sources:
  - path: https://developers.digital.go.jp/documents/jgrants/api/
fields:
  - name: id
    title: 補助金 ID
  - name: fingerprint
    title: 一覧の行の SHA-256
  - name: fetched_at
    title: 詳細の取得日時
    description: ISO 8601（UTC）
  - name: list_json
    title: 一覧 API の行（JSON）
  - name: detail_json
    title: 詳細 API の結果（JSON）
    description: 添付はファイル名だけです
