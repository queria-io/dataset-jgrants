schema: subsidy
name: subsidies
title: Jグランツの補助金
description: |-
  Jグランツに載っている補助金です。1 行が 1 補助金で、受付が終わったものも含みます。

  - Jグランツで申請を受けない自治体の補助金は含みません
  - 補助上限額の 0 は、上限なしか未記入です（原典で区別できません）
  - 公募要領・交付要綱・申請様式はファイル名だけを持ちます
primary_key: [subsidy_id]
sources:
  - path: https://developers.digital.go.jp/documents/jgrants/api/
fields:
  - name: subsidy_id
    title: 補助金 ID
    description: Jグランツの補助金 ID（18 文字）。portal_url の末尾と同じです
  - name: subsidy_number
    title: 補助金番号
    description: Jグランツの管理番号（S-00010016 の形）
  - name: title
    title: 補助金名
  - name: title_municipality
    title: タイトルにある市区町村
    description: タイトル先頭の【】にある市区町村名（福岡県宗像市 など）
  - name: catch_phrase
    title: キャッチフレーズ
  - name: detail_html
    title: 概要（HTML）
    description: 原典の概要。問い合わせ先や外部リンクを含みます
  - name: detail_text
    title: 概要
    description: detail_html からタグを除いたテキスト。段落は改行で区切ります
  - name: use_purposes
    title: 利用目的
    description: Jグランツの検索区分（設備整備・IT導入をしたい など）の配列。15 種類
    annotations: { queria: { semantic: { role: dimension } } }
  - name: industries
    title: 業種
    description: Jグランツの検索区分の配列。20 種類
    annotations: { queria: { semantic: { role: dimension } } }
  - name: target_number_of_employees
    title: 対象の従業員数
    description: 従業員数の制約なし・300名以下 など
    annotations: { queria: { semantic: { role: dimension } } }
  - name: subsidy_rate
    title: 補助率
    description: 原典の文字のまま（1/2、３／４ など）
  - name: subsidy_max_limit
    title: 補助上限額
    description: 円。0 は上限なしか未記入です
    annotations: { queria: { semantic: { role: measure, agg: max } } }
  - name: request_reception
    title: 申請受付の有無
    description: 原典の request_reception_presence が「有」なら true
  - name: multiple_requests_allowed
    title: 複数申請の可否
  - name: grant_type
    title: 類型
    description: 一般・一般型 など
    annotations: { queria: { semantic: { role: dimension } } }
  - name: program_name
    title: 事業名
    description: 原典の institution_name。実施機関名ではなく事業名が入っています
  - name: portal_url
    title: Jグランツのページ
  - name: guideline_files
    title: 公募要領のファイル名
  - name: outline_files
    title: 交付要綱のファイル名
  - name: form_files
    title: 申請様式のファイル名
  - name: fetched_at
    title: 取得日時
    description: この行の詳細を Jグランツから取得した日時
