schema: subsidy
name: rounds
title: Jグランツの補助金の募集回
description: |-
  補助金の募集回です。1 行が 1 補助金の 1 回で、受付期間・事業完了期限・対象地域を持ちます。

  - 日時はタイムゾーン付きです（原典は UTC）
  - 原典の入力誤り（3026 年など）を避けるため、2100 年より後の日時は NULL にしています
primary_key: [round_id]
sources:
  - path: https://developers.digital.go.jp/documents/jgrants/api/
fields:
  - name: round_id
    title: 募集回 ID
    description: Jグランツの workflow の ID
  - name: subsidy_id
    title: 補助金 ID
    description: subsidies の subsidy_id
  - name: fiscal_year_round
    title: 年度・回
    description: 原典の文字列のまま
  - name: target_area
    title: 対象地域
    description: 原典の文字列のまま（/ 区切り）
  - name: target_area_detail
    title: 対象地域の詳細
    description: 原典の文字列のまま
  - name: acceptance_start_at
    title: 受付開始日時
    description: タイムゾーン付き
  - name: acceptance_end_at
    title: 受付終了日時
    description: タイムゾーン付き
  - name: project_end_at
    title: 事業完了期限
    description: タイムゾーン付き
