# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: jgrants
title: デジタル庁 Jグランツ 補助金
description: |-
  デジタル庁の補助金申請システム「Jグランツ」に載っている補助金の一覧です。補助金ごとの補助率・補助上限額と、募集回ごとの受付期間・対象地域を収録し、毎日更新します。

  出典：Jグランツ（デジタル庁）。Queria が公開 API から取得して加工したものです。
keywords:
- 補助金
- 助成金
- Jグランツ
- jGrants
- 公募
- 受付期間
- 補助率
- 補助上限額
- 中小企業
- デジタル庁
homepage: https://github.com/queria-io/dataset-jgrants
language: ja
licenses:
- CC-BY-4.0
sources:
- title: デジタル庁 Jグランツ API ドキュメント
  path: https://developers.digital.go.jp/documents/jgrants/api/
- title: Jグランツ
  path: https://www.jgrants-portal.go.jp/
contributors:
- title: デジタル庁
  path: https://www.digital.go.jp/
  roles:
  - rightsHolder
spatial_coverage:
- JP
update_frequency: daily
schemas:
- name: subsidy
  title: 補助金
annotations:
  queria:
    themes:
    - government_finance
    - economy
    cover: 💴
