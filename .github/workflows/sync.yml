name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 毎日 04:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@5438b43d5e32827d10d49863aa57f4f5303fbab7
    with:
      dataset_name: jgrants
      # 初回の全件取得（詳細 3,845 件を 1 秒おき）は 1 時間 52 分かかる
      timeout_minutes: 180
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
