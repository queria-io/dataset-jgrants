name: Build

# 公開せずにパイプラインと dbt build だけを回す。J グランツの API の形が変わったときに
# Sync より先に気づくため。初回の全件は 2 時間かかるので、前回公開した詳細を使い回す
on:
  pull_request:
  workflow_dispatch:

# 初回の公開までは 1 回 2 時間かかり、J グランツへ詳細を 3,845 回取りに行く。同じ PR の古いランは止める
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # 共通のスクリプト (dataset-shared) を main で取得する
      - run: git clone --depth=1 https://github.com/queria-io/dataset-shared.git shared
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      # 前回の詳細は公開中の main から読む（Sync と同じく fdl clone で）。書き戻しはしない
      # fdl clone はバージョンの説明 (dataset.json と README.md など) を実行したフォルダに書き、
      # 同じ名前のファイルがあると止まる。説明はこのリポジトリの tabledoc.yml なので、空のフォルダで実行する
      - run: here="$PWD"; cd "$(mktemp -d)" && uv run --project "$here" fdl clone https://data.queria.io/datasets/queria/jgrants/ "$here/.fdl/work.sqlite"
      - run: uv run python -c "import main; main.download_jgrants()"
        env:
          FDL_WORKING: ${{ github.workspace }}/.fdl/work.sqlite
      - run: uv run dbt build --profiles-dir ci
