name: Build

# 公開せずにパイプラインと dbt build だけを回す。J グランツの API の形が変わったときに
# Sync より先に気づくため。初回の全件は 2 時間かかるので、前回公開した詳細を使い回す
on:
  pull_request:
  workflow_dispatch:

# 初回の公開までは 1 回 2 時間かかり、J グランツへ詳細を 3,845 回取りに行く。同じ PR の古いランは止める
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      # 前回の詳細は公開中の main から読む（Sync と同じく fdl checkout で）。書き戻しはしない
      - run: uv run fdl checkout https://data.queria.io/datasets/queria/jgrants/ .fdl/work.sqlite
      - run: uv run python -c "import main; main.download_jgrants()"
        env:
          FDL_WORKING: ${{ github.workspace }}/.fdl/work.sqlite
      - run: uv run dbt build --profiles-dir ci
